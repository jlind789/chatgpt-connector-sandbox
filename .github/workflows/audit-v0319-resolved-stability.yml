name: Audit v0.3.19 resolved stability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-v0319-resolved-stability.yml'

permissions:
  contents: write

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        season: ["2022-23", "2023-24"]
        seat: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen runtime
        run: |
          unzip -o Fantasy-Decision-Engine-v0.3.17-Development-Backtest-Runtime.zip -d .runtime_v0317
          pip install -r .runtime_v0317/requirements-tested.txt
      - name: Run resolved-decision stability audit
        run: python scripts/audit_v0319_resolved_stability.py "${{ matrix.season }}" "${{ matrix.seat }}"
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-${{ matrix.season }}-seat${{ matrix.seat }}
          path: historical/calibration_v0319/resolved_audit_chunks/${{ matrix.season }}_seat${{ matrix.seat }}.json
          retention-days: 30

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: resolved-*
          path: historical/calibration_v0319/resolved_audit_chunks
          merge-multiple: true
      - name: Aggregate audit
        run: python scripts/aggregate_v0319_resolved_stability.py
      - name: Commit audit results
        run: |
          git config user.name "chatgpt-historical-calibration"
          git config user.email "actions@users.noreply.github.com"
          git add historical/calibration_v0319
          if git diff --cached --quiet; then
            echo "No audit result changes"
          else
            git commit -m "Add v0.3.19 resolved stability audit results"
            git pull --rebase origin main
            git push
          fi
