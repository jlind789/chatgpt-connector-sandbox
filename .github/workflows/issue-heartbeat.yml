name: Issue trigger heartbeat

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  heartbeat:
    if: startsWith(github.event.issue.title, 'RUN_HEARTBEAT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record heartbeat
        run: |
          mkdir -p results/heartbeat
          echo "issue-trigger-ok" > results/heartbeat/status.txt
          git config user.name "chatgpt-heartbeat"
          git config user.email "actions@users.noreply.github.com"
          git add results/heartbeat/status.txt
          git commit -m "Record issue-trigger heartbeat" || true
          git pull --rebase origin main
          git push
