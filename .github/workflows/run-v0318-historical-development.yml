name: Run v0.3.18 historical development backtests

on:
  workflow_run:
    workflows: ["Build v0.3.18 historical development fixtures"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seats:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        season: ["2022-23", "2023-24"]
        seat: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen runtime
        run: |
          unzip -o Fantasy-Decision-Engine-v0.3.17-Development-Backtest-Runtime.zip -d .runtime_v0317
          pip install -r .runtime_v0317/requirements-tested.txt
      - name: Run frozen historical seat
        run: python scripts/run_historical_dev_seat.py "${{ matrix.season }}" "${{ matrix.seat }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hist-${{ matrix.season }}-seat${{ matrix.seat }}
          path: historical/seat_results_v0318/${{ matrix.season }}_seat${{ matrix.seat }}.json
          retention-days: 30

  aggregate:
    needs: seats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hist-*
          path: historical/seat_results_v0318
          merge-multiple: true
      - name: Aggregate development results
        run: python scripts/aggregate_historical_dev.py
      - name: Commit auditable development results
        run: |
          git config user.name "chatgpt-historical-data"
          git config user.email "actions@users.noreply.github.com"
          git add historical/seat_results_v0318 historical/results_v0318
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add v0.3.18 historical development backtest results"
            git pull --rebase origin main
            git push
          fi
