name: Workflow status probe
on:
  issues:
    types: [opened]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'RUN_STATUS_PROBE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query action runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/status
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=30",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as r:
              data=json.load(r)
          rows=[]
          for x in data.get("workflow_runs",[]):
              rows.append({
                  "id":x["id"],"name":x["name"],"event":x["event"],"status":x["status"],
                  "conclusion":x["conclusion"],"head_sha":x["head_sha"],
                  "created_at":x["created_at"],"updated_at":x["updated_at"],
                  "html_url":x["html_url"]
              })
          open("results/status/actions_runs.json","w").write(json.dumps(rows,indent=2)+"\n")
          PY
          git config user.name "chatgpt-status"
          git config user.email "actions@users.noreply.github.com"
          git add results/status/actions_runs.json
          git commit -m "Record workflow status probe" || true
          git pull --rebase origin main
          git push
